name: Build and release fonts

on:
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: iosevka-nerd-fonts-release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-24.04
        timeout-minutes: 180

        steps:
            - uses: actions/checkout@v5

            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - uses: actions/cache@v5
              with:
                  path: ~/.cache/deno
                  key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}

            - name: Check scripts
              run: deno check scripts/*.ts

            - name: Resolve Iosevka release
              id: source
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh api repos/be5invis/Iosevka/releases/latest --jq .tag_name | deno task prepare

            - name: Download upstream archives
              env:
                  GH_TOKEN: ${{ github.token }}
              run: >-
                  gh release download '${{ steps.source.outputs.tag }}'
                  --repo be5invis/Iosevka
                  --pattern 'PkgTTF-Iosevka-${{ steps.source.outputs.version }}.zip'
                  --pattern 'PkgTTF-IosevkaSlab-${{ steps.source.outputs.version }}.zip'
                  --dir work/downloads

            - name: Unpack archives
              run: deno task unpack '${{ steps.source.outputs.version }}'

            - name: Pull latest Nerd Fonts patcher image
              run: docker pull nerdfonts/patcher:latest

            - name: Patch all TTFs
              run: |
                  parallel --colsep '\t' --jobs 2 --halt now,fail=1 \
                    docker run --rm --entrypoint fontforge \
                    -v "$GITHUB_WORKSPACE/work/input/{1}:/in:ro" \
                    -v "$GITHUB_WORKSPACE/work/output/{1}:/out" \
                    nerdfonts/patcher:latest -script /nerd/font-patcher /in/{3} \
                    --complete --name {2} --outputdir /out \
                    < work/patch-plan.tsv

            - name: Package patched TTFs
              run: deno task package '${{ steps.source.outputs.version }}'

            - name: Publish/update release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ steps.source.outputs.tag }}
                  name: Iosevka Nerd Fonts ${{ steps.source.outputs.version }}
                  target_commitish: ${{ github.sha }}
                  files: artifacts/*.zip
                  fail_on_unmatched_files: true
                  overwrite_files: true
